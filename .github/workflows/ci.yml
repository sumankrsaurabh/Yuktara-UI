name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run native test suite
        run: python -m pytest -q tests/native

      - name: Compile package and examples
        run: python -m compileall -q novaui examples/native

      - name: Verify public package import
        run: python -c "import novaui; print('Yuktara UI import successful')"

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build wheel
        run: python -m build --wheel

      - name: Install built wheel
        run: python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Verify installed distribution
        run: |
          python -c "import importlib.metadata as m; import novaui; print('Installed yuktara-ui', m.version('yuktara-ui'))"

  coverage:
    name: Measure test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project, development and coverage dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" coverage

      - name: Run tests with coverage
        run: |
          coverage run --source=novaui.native -m pytest -q tests/native
          coverage report --show-missing
          coverage xml -o coverage.xml

      - name: Add coverage summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
