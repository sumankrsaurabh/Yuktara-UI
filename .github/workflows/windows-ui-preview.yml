name: Windows live UI preview

on:
  push:
    branches: [feat/adaptive-navigation-master-detail]
    paths:
      - "novaui/native/**"
      - "examples/native/design_system_gallery.py"
      - ".github/workflows/windows-ui-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-live-preview:
    name: Launch native UI and capture desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out Yuktara UI
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Yuktara UI and screenshot tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pillow

      - name: Run native test suite
        run: python -m pytest -q tests/native

      - name: Provision Skia and SDL3 for Windows
        run: python -m novaui setup

      - name: Launch the real SDL3 window and capture screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $env:SDL_RENDER_DRIVER = "software"
          $app = Start-Process -FilePath python -ArgumentList @("examples/native/design_system_gallery.py") -PassThru -WorkingDirectory $PWD -RedirectStandardOutput "$PWD/artifacts/gallery-stdout.txt" -RedirectStandardError "$PWD/artifacts/gallery-stderr.txt"
          try {
            Start-Sleep -Seconds 12
            if ($app.HasExited) {
              Get-Content "artifacts/gallery-stdout.txt" -ErrorAction SilentlyContinue
              Get-Content "artifacts/gallery-stderr.txt" -ErrorAction SilentlyContinue
              throw "Yuktara gallery exited before a screenshot could be captured. Exit code: $($app.ExitCode)"
            }
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $PWD "artifacts/yuktara-windows-desktop.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
            if ((Get-Item "artifacts/yuktara-windows-desktop.png").Length -lt 10000) {
              throw "Screenshot is unexpectedly small; the desktop capture may be blank."
            }
            Write-Host "Captured Windows desktop while Yuktara SDL3 gallery was running."
          }
          finally {
            if (!$app.HasExited) {
              Stop-Process -Id $app.Id -Force
            }
          }

      - name: Upload live UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuktara-windows-live-ui
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
