name: Import verified Yuktara UI Native 3.3.0.dev0

on:
  push:
    branches: [main]
    paths:
      - ".yuktara-bootstrap/IMPORT_3.3_READY"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and safely extract the 3.3.0 source archive
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import pathlib
          import tarfile
          import tomllib

          staging = pathlib.Path(".yuktara-bootstrap")
          chunks = [staging / f"source-{i:02d}.b64" for i in range(1, 14)]
          encoded = "".join(path.read_text(encoding="ascii").strip() for path in chunks)
          archive_bytes = base64.b64decode(encoded, validate=True)

          expected = "a35410101397ec80dd13353da97b359f02ac9ee6d3cd1e586a221b3df28a0806"
          actual = hashlib.sha256(archive_bytes).hexdigest()
          if actual != expected:
              raise SystemExit(f"Source archive SHA-256 mismatch: {actual}")

          destination = pathlib.Path("/tmp/yuktara-ui-3.3").resolve()
          destination.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:gz") as bundle:
              members = bundle.getmembers()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"Unsupported archive entry: {member.name}")
              bundle.extractall(destination, filter="data")

          project_file = destination / "pyproject.toml"
          if not project_file.is_file():
              raise SystemExit("Archive does not contain pyproject.toml")
          project = tomllib.loads(project_file.read_text(encoding="utf-8"))
          version = project.get("project", {}).get("version")
          if version != "3.3.0.dev0":
              raise SystemExit(f"Expected package version 3.3.0.dev0, got {version!r}")

          for required in ("novaui", "tests", "docs", "examples", "README.md"):
              if not (destination / required).exists():
                  raise SystemExit(f"Archive missing required path: {required}")

          print(f"Verified Yuktara UI {version}: {len(members)} archive entries; SHA-256 {actual}")
          PY

      - name: Replace repository files with the verified 3.3.0 source
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .
          cp -a /tmp/yuktara-ui-3.3/. .
          rm -rf .yuktara-bootstrap .yuktara-import-3.3
          find . -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache -o -name build -o -name '*.egg-info' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run the complete test suite
        run: python -m pytest -q

      - name: Compile Python source
        run: python -m compileall -q novaui

      - name: Build the wheel distribution
        run: python -m build --wheel

      - name: Commit and push Yuktara UI 3.3.0 source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import verified Yuktara UI Native 3.3.0.dev0 source"
          git push origin HEAD:main
