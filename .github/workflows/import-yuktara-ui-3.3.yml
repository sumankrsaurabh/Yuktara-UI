name: Import verified Yuktara UI Native 3.3.0.dev0

on:
  push:
    branches: [main]
    paths:
      - ".yuktara-import-3.3/READY"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import pathlib
          import tarfile
          import tomllib

          stage = pathlib.Path(".yuktara-import-3.3")
          parts = [stage / f"payload-{i:02d}.b64" for i in range(1, 9)]
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          expected = "743c8a459e52fe7a7480b11279c3ac62783a43e1f25cecbf9379698b54d3752e"
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f"Archive SHA-256 mismatch: {actual}")

          target = pathlib.Path("/tmp/yuktara-ui-3.3").resolve()
          target.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as archive:
              members = archive.getmembers()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"Unsupported archive entry: {member.name}")
              archive.extractall(target, filter="data")

          project = target / "pyproject.toml"
          if not project.is_file():
              raise SystemExit("Source archive does not contain pyproject.toml")
          metadata = tomllib.loads(project.read_text(encoding="utf-8"))
          version = metadata.get("project", {}).get("version")
          if version != "3.3.0.dev0":
              raise SystemExit(f"Unexpected package version: {version}")
          for required in ("novaui", "tests", "docs", "examples", "README.md"):
              if not (target / required).exists():
                  raise SystemExit(f"Missing required source path: {required}")
          print(f"Verified Yuktara UI {version}; {len(members)} tar entries; SHA-256 {actual}")
          PY

      - name: Replace repository source with verified 3.3.0 source
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | while IFS= read -r -d '' path; do
            rm -f -- "$path"
          done
          find . -depth -type d -empty -not -path './.git*' -delete || true
          cp -a /tmp/yuktara-ui-3.3/. .
          rm -rf .yuktara-bootstrap .yuktara-import-3.3
          rm -f .github/workflows/import-yuktara-ui-3.3.yml
          find . -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache -o -name build -o -name '*.egg-info' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Compile Python packages
        run: python -m compileall -q novaui

      - name: Build distributable wheel
        run: python -m build --wheel

      - name: Commit verified Yuktara UI 3.3.0 source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import verified Yuktara UI Native 3.3.0.dev0 source"
          git push origin HEAD:main
