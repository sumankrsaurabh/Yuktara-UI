name: One-time native source import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-native-source.yml"

permissions:
  contents: write

jobs:
  import-native-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the verified Yuktara UI source archive
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import io
          import pathlib
          import tarfile

          staging = pathlib.Path(".yuktara-bootstrap")
          chunks = [
              staging / "source-01.b64",
              staging / "source-02.b64",
              staging / "source-03.b64",
          ]
          encoded = "".join(path.read_text(encoding="ascii").strip() for path in chunks)
          archive = gzip.decompress(base64.b64decode(encoded, validate=True))
          destination = pathlib.Path(".").resolve()

          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as bundle:
              for member in bundle.getmembers():
                  target = (destination / member.name).resolve()
                  if destination not in target.parents or not member.isfile():
                      raise RuntimeError(f"Unsafe archive entry: {member.name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = bundle.extractfile(member)
                  if source is None:
                      raise RuntimeError(f"Unable to read archive entry: {member.name}")
                  target.write_bytes(source.read())

          staging_dir = pathlib.Path(".yuktara-bootstrap")
          import shutil
          shutil.rmtree(staging_dir)
          workflow_file = pathlib.Path(".github/workflows/import-native-source.yml")
          workflow_file.unlink(missing_ok=True)
          PY

      - name: Commit the imported framework source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Yuktara UI Native 2.2 component library"
          git push origin HEAD:main
